name: Build Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"

      - name: Build extension package
        run: |
          # Create dist directory
          mkdir -p dist
          
          # Copy extension files
          cp manifest.json background.js content.js popup.html popup.js dist/
          cp -r icons dist/
          cp -r styles dist/
          cp -r utils dist/
          
          # Create zip package
          cd dist
          zip -r ../nqi-tools-extension-v${{ steps.version.outputs.version }}.zip .
          cd ..
          
          echo "Package created: nqi-tools-extension-v${{ steps.version.outputs.version }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: nqi-tools-extension-v${{ steps.version.outputs.version }}.zip
          retention-days: 90

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## 大数据平台数据导出工具 v${{ steps.version.outputs.version }}
            
            ### 📦 下载安装
            
            下载 `nqi-tools-extension-v${{ steps.version.outputs.version }}.zip` 文件
            
            ### 🔧 安装步骤
            
            1. 下载并解压 zip 文件
            2. 打开 Chrome 浏览器
            3. 访问 `chrome://extensions/`
            4. 开启右上角「开发者模式」
            5. 点击「加载已解压的扩展程序」
            6. 选择解压后的文件夹
            
            ### ✨ 功能特性
            
            - 一键导出大数据平台即席查询的全部数据
            - 支持导出为 Excel 格式
            - 自动处理分页数据
          files: nqi-tools-extension-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
