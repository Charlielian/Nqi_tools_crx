<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NQI导出</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 320px;
            min-height: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #1e1e2e 0%, #181825 100%);
            color: #cdd6f4;
        }

        /* 头部区域 */
        .header {
            background: linear-gradient(135deg, #89b4fa 0%, #74c7ec 100%);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1e1e2e;
            letter-spacing: 0.5px;
        }

        /* 内容区域 */
        .content {
            padding: 20px;
        }

        /* 统计卡片 */
        .stat-card {
            background: linear-gradient(135deg, #313244 0%, #45475a 100%);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid #45475a;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .stat-val {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #89b4fa, #f5c2e7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .stat-lbl {
            font-size: 14px;
            color: #a6adc8;
            margin-top: 8px;
            font-weight: 500;
        }

        /* 状态栏 */
        .status-bar {
            background: #313244;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #a6e3a1;
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px rgba(166, 227, 161, 0.5);
        }

        .status-dot.loading {
            background: #f9e2af;
            animation: pulse-loading 1s infinite;
        }

        .status-dot.error {
            background: #f38ba8;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        @keyframes pulse-loading {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            font-size: 14px;
            color: #a6adc8;
            flex: 1;
        }

        /* 进度条 */
        .progress-container {
            background: #313244;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-percent {
            font-size: 16px;
            font-weight: 600;
            color: #89b4fa;
        }

        .progress-status {
            font-size: 13px;
            color: #6c7086;
        }

        .progress-bar {
            height: 8px;
            background: #45475a;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #89b4fa, #74c7ec);
            border-radius: 4px;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(137, 180, 250, 0.4);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #6c7086;
            margin-top: 10px;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            padding: 16px 18px;
            font-size: 15px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #89b4fa 0%, #74c7ec 100%);
            color: #1e1e2e;
            box-shadow: 0 4px 16px rgba(137, 180, 250, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(137, 180, 250, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
        }

        .btn-secondary:hover {
            background: #45475a;
            border-color: #585b70;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-icon {
            font-size: 18px;
        }

        /* 刷新按钮 */
        .refresh-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #45475a;
            border-radius: 12px;
            background: transparent;
            color: #a6adc8;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .refresh-btn:hover {
            background: #313244;
            color: #cdd6f4;
            border-color: #585b70;
        }

        /* 底部 */
        .footer {
            padding: 16px 20px;
            text-align: center;
            font-size: 13px;
            color: #6c7086;
            border-top: 1px solid #313244;
            background: #11111b;
        }

        .footer a {
            color: #89b4fa;
            text-decoration: none;
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }

        /* 加载状态 */
        .loading-view {
            padding: 50px 20px;
            text-align: center;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #313244;
            border-top-color: #89b4fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            color: #6c7086;
        }

        /* 无数据状态 */
        .no-data-view {
            padding: 40px 20px;
            text-align: center;
        }

        .no-data-icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .no-data-text {
            font-size: 15px;
            color: #6c7086;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">📊</div>
        <h1>NQI 数据导出</h1>
    </div>

    <div class="content">
        <!-- 加载中视图 -->
        <div id="loading-view" class="loading-view">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在检测页面数据...</div>
        </div>

        <!-- 无数据视图 -->
        <div id="no-data-view" class="no-data-view hidden">
            <div class="no-data-icon">📭</div>
            <div class="no-data-text">未检测到数据表格</div>
            <button class="refresh-btn" id="refresh-btn-empty">
                <span>🔄</span> 重新检测
            </button>
        </div>

        <!-- 数据视图 -->
        <div id="data-view" class="hidden">
            <div class="stat-card">
                <div class="stat-val" id="stat-total">-</div>
                <div class="stat-lbl">总记录数</div>
            </div>

            <div class="status-bar">
                <div class="status-dot" id="status-dot"></div>
                <span class="status-text" id="status-text">已就绪 · 检测到数据表格</span>
            </div>

            <div class="progress-container" id="progress-container">
                <div class="progress-header">
                    <span class="progress-percent" id="progress-percent">0%</span>
                    <span class="progress-status" id="progress-status">准备中...</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
                <div class="progress-info">
                    <span>已获取: <span id="progress-fetched">0</span> 条</span>
                    <span id="progress-remaining">剩余计算中...</span>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="export-excel-btn">
                    <span class="btn-icon">📥</span> 导出 Excel
                </button>
                <button class="btn btn-secondary" id="export-csv-btn">
                    <span class="btn-icon">📄</span> 导出 CSV
                </button>
            </div>

            <button class="refresh-btn" id="refresh-btn">
                <span>🔄</span> 刷新数据
            </button>
        </div>
    </div>

    <div class="footer">
        NqiTool v1.4 · 数据导出工具
    </div>

    <script src="sidebar.js"></script>
</body>
</html>
